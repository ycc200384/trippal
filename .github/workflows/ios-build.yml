name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Set Xcode project config
        run: |
          cd ios/App
          # Set bundle ID
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.trippal.app" App/Info.plist
          # Set display name
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 旅行管家" App/Info.plist
          # Set version
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" App/Info.plist

      - name: Build iOS Archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Export IPA
        run: |
          cat > ${{ github.workspace }}/build/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -exportPath ${{ github.workspace }}/build/ipa \
            -exportOptionsPlist ${{ github.workspace }}/build/exportOptions.plist

      - name: Rename IPA
        run: |
          mv ${{ github.workspace }}/build/ipa/App.ipa ${{ github.workspace }}/build/ipa/TripPal-$(date +%Y%m%d-%H%M).ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripPal-iOS
          path: ${{ github.workspace }}/build/ipa/*.ipa
          retention-days: 30

      - name: Build Summary
        run: |
          echo "✅ IPA built successfully!"
          echo "📱 Download from the 'Artifacts' section of this workflow run."
          echo "📲 Install via AltStore on your iPhone."
          ls -lh ${{ github.workspace }}/build/ipa/
