<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- Capacitor viewport -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="旅行管家" />
  <meta name="theme-color" content="#C75B39" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- Prevent callout / selection -->
  <meta name="format-detection" content="telephone=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <title>旅行管家 TripPal</title>
  <style>
    /* iOS safe area — applied immediately before React mounts */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    html, body {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    /* Capacitor status bar padding */
    body.capacitor-native {
      padding-top: var(--sat);
    }
  </style>
</head>
<body class="bg-warm-bg text-warm-ink font-body antialiased">
  <div id="root"></div>
  <!-- Capacitor JS bridge -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
